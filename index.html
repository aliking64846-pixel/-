<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>لوحة التحكم - إدارة المخزون</title>

<style>
body{
    margin:0;
    font-family: "Segoe UI", Tahoma, Arial;
    background:#f5f7fb;
}

/* sidebar */
.sidebar{
    position:fixed;
    right:0;
    top:0;
    width:240px;
    height:100vh;
    background:#243447;
    color:#fff;
    padding:20px;
}

.sidebar h2{
    margin-bottom:30px;
    font-size:20px;
}

.sidebar a{
    display:block;
    color:#fff;
    text-decoration:none;
    padding:12px;
    margin-bottom:8px;
    border-radius:8px;
}

.sidebar a:hover{
    background:#3b82f6;
}

/* main */
.main{
    margin-right:260px;
    padding:30px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

.card-container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.card{
    background:#fff;
    border-radius:15px;
    padding:25px;
    box-shadow:0 10px 20px rgba(0,0,0,.08);
}

.card h3{
    margin-bottom:15px;
    font-size:18px;
}

.big{
    font-size:40px;
    font-weight:bold;
}

.alert{
    background:#fff3e0;
    padding:10px;
    border-radius:8px;
    margin-top:10px;
    color:#d97706;
}
</style>
</head>

<body>

<div class="sidebar">
    <h2>Inventory System</h2>
    <a href="index.html">Dashboard</a>
    <a href="inventory.html" class="active">Inventory</a>
    <a href="#">QR / RFID</a>
    <a href="#">AI Suggestions</a>
    <a href="#">Environment</a>
    <a href="#">Reports</a>
    <a href="#">Settings</a>
</div>

<div class="main">
    <div class="topbar">
        <h2>لوحة التحكم</h2>
        <button>تسجيل خروج</button>
    </div>

    <div class="card-container">
        <div class="card">
            <h3>حالة المخزون</h3>
            <div class="big">120</div>
            <div class="alert">النقص المتوقع: 5 مواد</div>
        </div>

        <div class="card">
            <h3>درجة الحرارة والرطوبة</h3>
            <div class="big">24°C</div>
            <p>الرطوبة: 60%</p>
        </div>

        <div class="card">
            <h3>تحليلات الذكاء الاصطناعي</h3>
            <ul>
                <li>مواد تنفد قريباً</li>
                <li>توصيات تخزين</li>
            </ul>
        </div>
    </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>
<style>
/* ===== CSS كامل هنا ===== */
body{
    margin:0;
    font-family:Segoe UI, Tahoma, Arial;
    background:#f5f7fb;
}
.sidebar{
    position:fixed;
    right:0;
    top:0;
    width:240px;
    height:100vh;
    background:#243447;
    color:#fff;
    padding:20px;
}
.sidebar h2{margin-bottom:30px;}
.sidebar a{
    display:block;
    color:#fff;
    text-decoration:none;
    padding:12px;
    margin-bottom:8px;
    border-radius:8px;
}
.sidebar a.active,
.sidebar a:hover{background:#3b82f6;}
.main{margin-right:260px;padding:30px;}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;}
.card{background:#fff;padding:25px;border-radius:15px;box-shadow:0 10px 20px rgba(0,0,0,.08);}
.big{font-size:38px;font-weight:bold;}
@media (max-width:768px){.main{margin-right:0;padding:15px;}.sidebar{width:200px;}}
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
// ===== JS كامل هنا (لو محتاج رسم بياني) =====
window.addEventListener('DOMContentLoaded', ()=>{
  const labels = Array.from({length:30}, (_,i)=>`يوم ${i+1}`);
  const data = {labels:labels,datasets:[{label:'كمية المواد',backgroundColor:'#3b82f6',borderColor:'#2563eb',data:Array.from({length:30},()=>Math.floor(Math.random()*150))}]};
  const config={type:'line',data:data,options:{responsive:true,plugins:{legend:{display:false}}}};
  const ctx = document.createElement('canvas');
  ctx.id='inventoryChart';
  document.querySelector('.main').appendChild(ctx);
  new Chart(ctx, config);
});
</script>
</head>
<body>

<div class="sidebar">
  <h2>Inventory System</h2>
  <a href="index.html" class="active">Dashboard</a>
  <a href="inventory.html">Inventory</a>
</div>

<div class="main">
  <h2>لوحة التحكم</h2>
  <div class="cards">
    <div class="card"><h3>عدد المواد</h3><div class="big">120</div></div>
    <div class="card"><h3>المواد القليلة</h3><div class="big">5</div></div>
    <div class="card"><h3>درجة الحرارة</h3><div class="big">24°C</div></div>
  </div>
</div>

</body>
</html>
